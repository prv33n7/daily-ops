name: Scheduled Maintenance

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix:   ${{ steps.split.outputs.matrix }}
      count:    ${{ steps.sync.outputs.count }}
      scanned:  ${{ steps.sync.outputs.count }}
      rundate:  ${{ steps.split.outputs.rundate }}

    steps:
      - name: Prepare workspace
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: core

      - name: Sync data
        id: sync
        run: |
          python3 -I core/daily/fetch_delta.py > /tmp/items.txt
          COUNT=$(wc -l < /tmp/items.txt | tr -d ' ')
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Update state
        if: steps.sync.outputs.count != '0'
        run: |
          cd core
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/known_images.txt
          git diff --cached --quiet || git commit -m "chore: state update [$(date -u +%Y-%m-%d)]"
          git push

      - name: Prepare jobs
        id: split
        run: |
          RUNDATE=$(date -u +%Y-%m-%d)
          echo "rundate=$RUNDATE" >> $GITHUB_OUTPUT
          RUNDATE="$RUNDATE" python3 -I - <<'EOF'
          import json, math, os
          from pathlib import Path

          txt = Path('/tmp/items.txt').read_text().strip()
          images = txt.splitlines() if txt else []
          n = len(images)
          rundate = os.environ['RUNDATE']

          chunks = min(8, max(1, math.ceil(n / 2000))) if n > 0 else 1
          size   = math.ceil(n / chunks) if n > 0 else 1

          chunk_dir = Path('core') / 'run-data' / rundate / 'chunks'
          chunk_dir.mkdir(parents=True, exist_ok=True)

          include = []
          for i in range(chunks):
              batch = images[i*size:(i+1)*size]
              (chunk_dir / f'chunk-{i}.txt').write_text('\n'.join(batch))
              include.append({'chunk': i})

          matrix = json.dumps({'include': include})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'matrix={matrix}\n')
          EOF

      - name: Store chunks in private repo
        if: steps.sync.outputs.count != '0'
        run: |
          cd core
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add run-data/
          git diff --cached --quiet || git commit -m "run: store chunks [$(date -u +%Y-%m-%d)]"
          git push

  process:
    needs: setup
    if: needs.setup.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      matrix:    ${{ fromJson(needs.setup.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Prepare workspace
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: core

      - name: Install dependencies
        run: |
          pip install requests --quiet
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Run checks (${{ matrix.chunk }})
        run: |
          python3 -I core/daily/scan_delta.py \
            --input   core/run-data/${{ needs.setup.outputs.rundate }}/chunks/chunk-${{ matrix.chunk }}.txt \
            --db      /tmp/results-${{ matrix.chunk }}.db \
            --out     /tmp/results-${{ matrix.chunk }}.csv \
            --workers 4 \
            --timeout 300

      - name: Save results to private repo
        if: always()
        run: |
          RUNDATE="${{ needs.setup.outputs.rundate }}"
          CHUNK="${{ matrix.chunk }}"
          cd core
          mkdir -p "run-data/$RUNDATE/findings"
          if [ -f "/tmp/results-${CHUNK}.csv" ]; then
            cp "/tmp/results-${CHUNK}.csv" "run-data/$RUNDATE/findings/chunk-${CHUNK}.csv"
          else
            touch "run-data/$RUNDATE/findings/chunk-${CHUNK}.csv"
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          for i in 1 2 3 4 5; do
            git pull --rebase origin "$BRANCH" || true
            git add "run-data/$RUNDATE/findings/chunk-${CHUNK}.csv"
            git diff --cached --quiet && { echo "Nothing to commit"; break; }
            git commit -m "findings: chunk-${CHUNK} [$RUNDATE]" && git push && break
            sleep $i
          done

  report:
    needs: [setup, process]
    if: always() && needs.setup.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Prepare workspace
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: core

      - name: Aggregate results
        env:
          RUNDATE: ${{ needs.setup.outputs.rundate }}
        run: |
          python3 -I - <<'EOF'
          import csv, glob, os
          from pathlib import Path

          rundate = os.environ['RUNDATE']
          header = ['image','detector','file_path','layer','raw','found_at']
          out = open('/tmp/daily_findings.csv', 'w', newline='')
          writer = csv.DictWriter(out, fieldnames=header)
          writer.writeheader()

          total = 0
          for f in sorted(glob.glob(f'core/run-data/{rundate}/findings/chunk-*.csv')):
              try:
                  for row in csv.DictReader(open(f)):
                      writer.writerow(row)
                      total += 1
              except Exception as e:
                  print(f'warn: {f}: {e}')
          out.close()
          print(f'Total: {total}')
          EOF

      - name: AI triage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -I core/daily/ai_triage.py /tmp/daily_findings.csv /tmp/triage.json

      - name: Send report
        env:
          EMAIL_FROM:     ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO:       ${{ secrets.EMAIL_TO }}
        run: python3 -I core/daily/notify_email.py /tmp/triage.json ${{ needs.setup.outputs.scanned }}

      - name: Cleanup run data
        if: always()
        run: |
          RUNDATE="${{ needs.setup.outputs.rundate }}"
          cd core
          if [ -d "run-data/$RUNDATE" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -rf "run-data/$RUNDATE/"
            git diff --cached --quiet || git commit -m "cleanup: run-data [$RUNDATE]"
            git push || (git pull --rebase && git push) || true
          fi
