name: Scheduled Maintenance

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}
      count:  ${{ steps.sync.outputs.count }}

    steps:
      - name: Prepare workspace
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: core

      - name: Sync data
        id: sync
        run: |
          python3 -I core/daily/fetch_delta.py > /tmp/items.txt
          COUNT=$(wc -l < /tmp/items.txt | tr -d ' ')
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Update state
        if: steps.sync.outputs.count != '0'
        run: |
          cd core
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/known_images.txt
          git diff --cached --quiet || git commit -m "chore: state update [$(date -u +%Y-%m-%d)]"
          git push

      - name: Prepare jobs
        id: split
        run: |
          python3 -I - <<'EOF'
          import json, math, os
          from pathlib import Path

          txt = Path('/tmp/items.txt').read_text().strip()
          images = txt.splitlines() if txt else []
          n = len(images)

          chunks = min(8, max(1, math.ceil(n / 2000))) if n > 0 else 1
          size   = math.ceil(n / chunks) if n > 0 else 1

          os.makedirs('/tmp/chunks', exist_ok=True)
          include = []
          for i in range(chunks):
              batch = images[i*size:(i+1)*size]
              Path(f'/tmp/chunks/chunk-{i}.txt').write_text('\n'.join(batch))
              include.append({'chunk': i})

          matrix = json.dumps({'include': include})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'matrix={matrix}\n')
          EOF

      - name: Cache data
        uses: actions/upload-artifact@v4
        with:
          name: data-chunks
          path: /tmp/chunks/
          retention-days: 1

  process:
    needs: setup
    if: needs.setup.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      matrix:    ${{ fromJson(needs.setup.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Prepare workspace
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: core

      - name: Install dependencies
        run: |
          pip install requests --quiet
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Restore cache
        uses: actions/download-artifact@v4
        with:
          name: data-chunks
          path: /tmp/chunks

      - name: Run checks (${{ matrix.chunk }})
        run: |
          python3 -I core/daily/scan_delta.py \
            --input   /tmp/chunks/chunk-${{ matrix.chunk }}.txt \
            --db      /tmp/results-${{ matrix.chunk }}.db \
            --out     /tmp/results-${{ matrix.chunk }}.csv \
            --workers 4 \
            --timeout 300

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.chunk }}
          path: /tmp/results-${{ matrix.chunk }}.csv
          retention-days: 90

  report:
    needs: [setup, process]
    if: always() && needs.setup.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Prepare workspace
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: core

      - name: Collect results
        id: dl
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: /tmp/results
          merge-multiple: false

      - name: Aggregate results
        run: |
          python3 -I - <<'EOF'
          import csv, glob
          from pathlib import Path

          header = ['image','detector','file_path','layer','raw','found_at']
          out = open('/tmp/daily_findings.csv', 'w', newline='')
          writer = csv.DictWriter(out, fieldnames=header)
          writer.writeheader()

          total = 0
          for f in sorted(glob.glob('/tmp/results/results-*/results-*.csv')):
              try:
                  for row in csv.DictReader(open(f)):
                      writer.writerow(row)
                      total += 1
              except Exception as e:
                  print(f'warn: {f}: {e}')
          out.close()
          print(f'Total: {total}')
          EOF

      - name: Send report
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: python3 -I core/daily/notify_slack.py /tmp/daily_findings.csv
