name: test-email

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test SMTP
        env:
          EMAIL_FROM:     ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO:       ${{ secrets.EMAIL_TO }}
        run: |
          python3 - <<'PYEOF'
          import smtplib, os
          from email.mime.text import MIMEText

          frm = os.environ['EMAIL_FROM']
          to  = os.environ['EMAIL_TO']
          pwd = os.environ['EMAIL_PASSWORD']

          msg = MIMEText('SMTP test from GitHub Actions — secrets are wired correctly.')
          msg['Subject'] = '[daily-ops] SMTP test'
          msg['From']    = frm
          msg['To']      = to

          try:
              with smtplib.SMTP('smtp.gmail.com', 587) as s:
                  s.ehlo()
                  s.starttls()
                  s.login(frm, pwd)
                  s.sendmail(frm, [to], msg.as_string())
              print('SUCCESS: email sent to', to)
          except Exception as e:
              print('FAILED:', e)
              raise SystemExit(1)
          PYEOF
